name: Construire APK Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remix-studio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Auditer la stabilité, les données et la fluidité
      - name: Vérifier l’interface et les scripts
        run: node tests/smoke.mjs

      - name: Vérifier les données et la réparation
        run: node tests/audit-model.mjs

      - name: Vérifier la conservation des projets si le stockage échoue
        run: node tests/project-storage-safety.mjs

      - name: Vérifier l’insertion au curseur
        run: node tests/insertion-cursor.mjs

      - name: Vérifier le Mode 2 naturel
        run: node tests/export-mode2.mjs

      - name: Vérifier la synchronisation du Mode 2
        run: node tests/mode2-sync.mjs

      - name: Vérifier la protection anti-blocage
        run: node tests/export-watchdog.mjs

      - name: Vérifier le mode réaction et les mises à jour
        run: node tests/reaction-update.mjs

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android 35
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Numéroter cette construction
        run: |
          echo "CI_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=3.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Vérifier la clé de signature permanente
        run: |
          test -f signing/remix-release.jks
          keytool -list -v -keystore signing/remix-release.jks -storepass 'RemixAuto2026!' -alias remixstudio > signing-key.txt
          grep -q "EF:47:F7:FE:94:C2:62:16:0A:09:6E:00:44:5C:B2:88:4B:F2:BF:86:32:D7:F9:A6:7A:AA:C5:CD:CC:22:F0:D1" signing-key.txt
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Construire l’APK avec CameraX
        run: |
          gradle projects --no-daemon
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Construire l’APK release signé
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Vérifier cryptographiquement l’APK release
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee release-signature.txt
          grep -q "Verifies" release-signature.txt
          grep -qi "ef47f7fe94c262160a096e00445cb2884bf2bf8632d7f9a67aaac5cdcc22f0d1" release-signature.txt

      - name: Vérifier le contenu réel de l’APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-content.txt
          grep -q "assets/www/index.html" apk-content.txt
          grep -q "assets/www/js/final-audit.js" apk-content.txt
          grep -q "assets/www/js/insertion-cursor.js" apk-content.txt
          grep -q "assets/www/js/export-mode2.js" apk-content.txt
          grep -q "assets/www/js/mode2-sync.js" apk-content.txt
          grep -q "assets/www/js/export-watchdog.js" apk-content.txt
          grep -q "assets/www/js/timeline-zoom.js" apk-content.txt
          grep -q "assets/www/js/camera.js" apk-content.txt
          grep -q "assets/www/js/reaction.js" apk-content.txt
          grep -q "assets/www/js/app-settings.js" apk-content.txt
          grep -q "assets/www/service-worker.js" apk-content.txt

      - name: Tester l’insertion à la ligne blanche
        run: node tests/insertion-cursor.mjs

      - name: Tester le Mode 2 interview naturelle
        run: node tests/export-mode2.mjs

      - name: Tester la synchronisation précise du Mode 2
        run: node tests/mode2-sync.mjs

      - name: Tester la protection anti-blocage de l’export
        run: node tests/export-watchdog.mjs

      - name: Rejouer les tests de non-régression
        run: |
          node tests/smoke.mjs
          node tests/audit-model.mjs
          node tests/project-storage-safety.mjs
          node tests/insertion-cursor.mjs
          node tests/export-mode2.mjs
          node tests/mode2-sync.mjs
          node tests/export-watchdog.mjs
          node tests/reaction-update.mjs

      - name: Préparer le fichier à télécharger
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/RemixStudio.apk
          sha256sum release/RemixStudio.apk > release/RemixStudio.apk.sha256

      - name: Conserver l’APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Remix-Studio-APK
          path: release/
          retention-days: 90
          if-no-files-found: error

      - name: Publier la dernière version téléchargeable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${CI_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/RemixStudio.apk release/RemixStudio.apk.sha256 --clobber
          else
            gh release create "$TAG" release/RemixStudio.apk release/RemixStudio.apk.sha256 --latest --title "Remix Studio ${CI_VERSION_NAME}" --notes "Mise à jour Android signée automatiquement avec la clé permanente Remix Studio. Installation depuis Réglages sans perte de données entre versions signées."
          fi
          gh release edit "$TAG" --latest

      - name: Enregistrer la réussite de la construction
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '{"status":"success","version":"%s","signed_release":true,"reaction_split_screen":true,"updates":true,"commit":"%s","built_at":"%s"}\n' "$CI_VERSION_NAME" "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > build-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.json
          git commit -m "Confirmer la construction APK ${CI_VERSION_NAME} [skip ci]" || exit 0
          git push
